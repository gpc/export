name: Update Contributors

on:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update contributors in project.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import json, os, re, urllib.request

          TOKEN = os.environ['GH_TOKEN']
          REPO  = os.environ['GITHUB_REPOSITORY']

          HEADERS = {
              'Authorization': f'token {TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'update-contributors-action',
          }

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def post(url, data):
              body = json.dumps(data).encode()
              req = urllib.request.Request(url, data=body, headers={**HEADERS, 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # 1. Fetch all contributors via REST (sorted by contributions desc)
          all_contributors = []
          page = 1
          while True:
              batch = get(f'https://api.github.com/repos/{REPO}/contributors?per_page=100&page={page}')
              if not batch:
                  break
              all_contributors.extend(batch)
              page += 1

          humans = [c for c in all_contributors if c.get('type') != 'Bot']
          if not humans:
              print('No human contributors found — skipping update')
              exit(0)

          node_ids     = [c['node_id'] for c in humans]
          login_by_nid = {c['node_id']: c['login'] for c in humans}

          # 2. Fetch display names via GraphQL
          query = 'query($ids:[ID!]!){nodes(ids:$ids){...on User{id name login}}}'
          gql   = post('https://api.github.com/graphql', {'query': query, 'variables': {'ids': node_ids}})
          nodes = gql['data']['nodes']
          name_by_nid = {n['id']: (n.get('name') or n['login']) for n in nodes if n}

          # 3. Build ordered map: login → display name (preserving contribution order)
          ordered = {}
          for c in humans:
              nid   = c['node_id']
              login = login_by_nid[nid]
              ordered[login] = name_by_nid.get(nid, login)

          # 4. Build the new contributors YAML block
          lines = ['contributors:']
          for login, name in ordered.items():
              safe = name.strip().replace('"', '\\"')
              lines.append(f'  {login}: "{safe}"')
          new_block = '\n'.join(lines) + '\n'

          # 5. Replace the contributors section in project.yml
          with open('project.yml', 'r') as f:
              content = f.read()

          # contributors: is always the last top-level key in project.yml
          idx = content.find('\ncontributors:\n')
          if idx >= 0:
              new_content = content[:idx + 1] + new_block
          else:
              new_content = content.rstrip('\n') + '\n' + new_block

          with open('project.yml', 'w') as f:
              f.write(new_content)

          print(f'Updated {len(ordered)} contributors in project.yml')
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet project.yml; then
            git add project.yml
            git commit -m "chore: update contributors [skip ci]"
            git push
          else
            echo "No contributor changes to commit"
          fi
